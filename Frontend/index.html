{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Price Prediction</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="container">

        <div class="header">
            <img src="{% static 'assets/house.png' %}" alt="House" class="logo">
            <h1>Real Estate Price Prediction</h1>
            <p>Predict house prices using Machine Learning</p>
        </div>

        <div class="card">
            <form id="predictionForm">

                <div class="input-group">
                    <label>Area (sq.ft)</label>
                    <input type="number" id="area" placeholder="Enter Area" required>
                </div>

                <div class="input-group">
                    <label>Bedrooms</label>
                    <input type="number" id="bedrooms" placeholder="Enter Bedrooms" required>
                </div>

                <div class="input-group">
                    <label>Bathrooms</label>
                    <input type="number" id="bathrooms" placeholder="Enter Bathrooms" required>
                </div>

                <div class="input-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="Enter Location" required>
                </div>

                <button type="submit">Predict Price</button>

            </form>

            <div id="result"></div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="{% static 'js/script.js' %}"></script>

    <script>
        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const data = {
                area: document.getElementById("area").value,
                bedrooms: document.getElementById("bedrooms").value,
                bathrooms: document.getElementById("bathrooms").value,
                location: document.getElementById("location").value
            };

            try {
                const response = await fetch("/predictions/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const output = await response.json();

                if (response.ok) {
                    result.innerHTML = `<h2>Predicted Price: ₹${output.predicted_price}</h2>`;
                } else {
                    result.innerHTML = `<p style="color:red;">${output.error || "Prediction failed."}</p>`;
                }

            } catch (error) {
                result.innerHTML = `<p style="color:red;">Server Error</p>`;
            }
        });
    </script>

</body>
</html>
